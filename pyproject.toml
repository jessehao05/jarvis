[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.18,<3",
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "click>=8.0",
    "python-dotenv>=1.0",
]

[project.scripts]
jarvis = "jarvis.cli:cli"
